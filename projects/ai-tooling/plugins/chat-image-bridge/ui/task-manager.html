<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,sans-serif}body{margin:0;padding:14px;background:transparent;color:CanvasText}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h2{font-size:17px;margin:0}.summary{font-size:12px;opacity:.7}.jobs{display:grid;gap:9px}.job{border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:10px;padding:11px;background:color-mix(in srgb,Canvas 96%,CanvasText 4%)}.line{display:flex;align-items:center;justify-content:space-between;gap:8px}.id{font:12px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis}.badge{font-size:11px;border-radius:999px;padding:3px 7px;background:#7772}.pending,.generating{background:#e7a90033;color:#9b6500}.review{background:#1688f033;color:#0871c9}.completed{background:#10a37f33;color:#087d61}.failed,.cancelled{background:#dc354533;color:#b42332}.preview{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:8px;margin-top:9px;background:#0001}.prompt{font-size:13px;margin:8px 0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:11px;opacity:.65}.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}button{border:1px solid color-mix(in srgb,CanvasText 22%,transparent);border-radius:7px;padding:5px 9px;background:Canvas;cursor:pointer;color:CanvasText}button.primary{background:#10a37f;color:white;border-color:#10a37f}button:disabled{opacity:.45;cursor:wait}.empty{text-align:center;padding:30px;opacity:.6}.error{color:#b42332;font-size:12px;margin-top:7px}
</style></head><body><div class="top"><div><h2>图片任务管理器</h2><div class="summary" id="summary">正在载入…</div></div><button id="refresh">刷新</button></div><div class="jobs" id="jobs"></div><script>
const standalone=null;const pending=new Map();let seq=1;let state={jobs:[]};const $=s=>document.querySelector(s);async function request(method,params){if(standalone){const key=encodeURIComponent(standalone.key);if(method!=="tools/call")throw new Error("不支持的操作");const name=params.name,args=params.arguments||{};if(name==="get_image_status"){const r=await fetch(`/jobs?key=${key}`,{cache:"no-store"});if(!r.ok)throw new Error(`刷新失败：HTTP ${r.status}`);return {structuredContent:await r.json()};}const action={accept_image:"accept",retry_image:"retry",cancel_image:"cancel"}[name];if(!action)throw new Error("不支持的工具");const r=await fetch(`/jobs/${encodeURIComponent(args.jobId)}/${action}?key=${key}`,{method:"POST",headers:{"content-type":"application/json"},body:"{}"});const body=await r.json();if(!r.ok)throw new Error(body.error||`操作失败：HTTP ${r.status}`);return {structuredContent:body};}const id=seq++;parent.postMessage({jsonrpc:"2.0",id,method,params},"*");return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(next){if(next?.jobs)state=next;const counts={};for(const j of state.jobs)counts[j.status]=(counts[j.status]||0)+1;$("#summary").textContent=`共 ${state.jobs.length} 个 · 待审核 ${counts.review||0} · 处理中 ${(counts.pending||0)+(counts.generating||0)}`;$("#jobs").innerHTML=state.jobs.length?state.jobs.map(j=>`<div class="job"><div class="line"><span class="id">${esc(j.id)}</span><span class="badge ${esc(j.status)}">${esc(j.status)}</span></div>${standalone&&j.hasCandidate?`<img class="preview" src="/jobs/${encodeURIComponent(j.id)}/candidate-file?key=${encodeURIComponent(standalone.key)}" alt="候选图片">`:""}<div class="prompt">${esc(j.prompt)}</div><div class="meta">${esc(j.outputPath)} · ${esc(j.updatedAt)}</div>${j.error?`<div class="error">${esc(j.error)}</div>`:""}<div class="actions">${j.status==="review"?`<button class="primary" data-action="accept_image" data-id="${esc(j.id)}">接受图片</button>`:""}${["failed","generating","cancelled"].includes(j.status)?`<button data-action="retry_image" data-id="${esc(j.id)}">重新排队</button>`:""}${!["completed","cancelled"].includes(j.status)?`<button data-action="cancel_image" data-id="${esc(j.id)}">取消</button>`:""}</div></div>`).join(""):`<div class="empty">暂无图片任务</div>`;}
async function refresh(){const r=await request("tools/call",{name:"get_image_status",arguments:{limit:30}});render(r?.structuredContent);}$("#refresh").onclick=refresh;$("#jobs").onclick=async e=>{const b=e.target.closest("button[data-action]");if(!b)return;b.disabled=true;try{await request("tools/call",{name:b.dataset.action,arguments:{jobId:b.dataset.id}});await refresh();}catch(err){alert(err?.message||"操作失败");}finally{b.disabled=false;}};
addEventListener("message",e=>{if(e.source!==parent)return;const m=e.data;if(!m||m.jsonrpc!=="2.0")return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;}if(m.method==="ui/notifications/tool-result")render(m.params?.structuredContent);},{passive:true});
if(window.openai?.toolOutput)render(window.openai.toolOutput);if(standalone)refresh();
setInterval(refresh,5000);
</script></body></html>
