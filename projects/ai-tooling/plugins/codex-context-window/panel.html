<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上下文窗口</title>
<style>
:root{color-scheme:light dark;font-family:var(--font-sans,system-ui,"Microsoft YaHei",sans-serif);background:var(--color-background-primary,#f6f7f9);color:var(--color-text-primary,#17202b)}
*{box-sizing:border-box}body{margin:0;padding:32px 20px}main{max-width:680px;margin:6vh auto}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--color-text-secondary,#64748b)}h1{font-size:28px;margin:12px 0}p{line-height:1.7}.muted{color:var(--color-text-secondary,#657181);font-size:14px}.card{margin:28px 0;padding:28px;border:1px solid var(--color-border-primary,#dce1e8);border-radius:20px;background:var(--color-background-secondary,#fff)}.value{display:flex;align-items:baseline;gap:10px;margin:12px 0 26px}output{font-size:64px;font-weight:650;letter-spacing:-.05em}.unit{color:var(--color-text-secondary,#657181)}input[type=range]{width:100%;accent-color:#2563eb;cursor:pointer;margin:16px 0;min-height:28px}.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--color-text-secondary,#657181)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}button{font:inherit;border:1px solid var(--color-border-primary,#dce1e8);border-radius:10px;padding:11px 17px;background:var(--color-background-primary,#f6f7f9);color:inherit;cursor:pointer}button.primary{background:#2563eb;color:white;border-color:#2563eb}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}#status{min-height:24px;font-size:14px;overflow-wrap:anywhere}#status.error{color:#c83e38}#status.success{color:#15803d}details{font-size:13px;overflow-wrap:anywhere;margin-top:20px}summary{cursor:pointer}#path{font-family:monospace;font-size:12px}@media(prefers-color-scheme:dark){:root{background:var(--color-background-primary,#15171b);color:var(--color-text-primary,#e5e7eb)}.card{background:var(--color-background-secondary,#202329);border-color:var(--color-border-primary,#373c46)}button{background:var(--color-background-primary,#292e37);border-color:var(--color-border-primary,#454c59)}.muted,.ticks,.unit{color:var(--color-text-secondary,#a5afbd)}}@media(max-width:440px){body{padding:20px 14px}main{margin:2vh auto}.card{padding:22px 18px}output{font-size:56px}}
</style></head><body><main>
<div class="eyebrow">CODEX · LOCAL SETTINGS</div><h1>上下文窗口</h1><p class="muted">拖动滑动条，调整 Codex 的上下文窗口配置。</p>
<section class="card" aria-label="上下文窗口设置"><label for="window">窗口大小</label><div class="value"><output id="value" for="window">512</output><span class="unit">k tokens</span></div>
<input id="window" type="range" min="256" max="1024" step="1" value="512" aria-label="上下文窗口，单位 k tokens" disabled><div class="ticks"><span>256k</span><span>1024k</span></div>
<p class="muted" id="saved">正在读取已保存的设置…</p><div class="actions"><button class="primary" id="apply" disabled>应用</button><button id="reset" disabled>恢复 512k</button><button id="reload">重新读取</button></div>
</section><p id="status" role="status" aria-live="polite"></p>
<p class="muted">1k = 1,000 tokens。保存后，请重启 Codex 并新建聊天使用。实际可用容量受模型上限限制。</p>
<details><summary>配置详情</summary><p id="path"></p><p id="details"></p><p class="muted">仅修改本机全局上下文窗口配置。项目或配置档中的覆盖值可能优先；自动压缩阈值保持原设置。</p></details>
</main><!-- SCRIPT --></body></html>
